<<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Omzet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Tennis Omzet</h1>

        <div id="datum" class="datum"></div>

<div class="card">

    <h2>💶 Actieve tarieven</h2>

    <div class="regel">
        <span>🎾 Privéles</span>
        <strong id="priveTariefWeergave"></strong>
    </div>

    <div class="regel">
        <span>👥 Groepsles</span>
        <strong id="groepTariefWeergave"></strong>
    </div>

    <div class="regel">
        <span>BTW</span>
        <strong id="btwWeergave"></strong>
    </div>

</div>
            <h2>Totale omzet vandaag</h2>

            <div id="omzetVandaag" class="grote-omzet">
                € 0,00
            </div>

            <div id="omzetExcl" class="subtekst">
                € 0,00 excl. btw
            </div>

            <hr>

            <div class="stats">

                <div>
                    <div id="priveAantal" class="stat-getal">0</div>
                    <div>Privélessen</div>
                </div>

                <div>
                    <div id="groepAantal" class="stat-getal">0</div>
                    <div>Groepslessen</div>
                </div>

            </div>

        </div>
    
<div class="card">

    <h2>Lesgegevens</h2>

    <label for="lesDatum">Datum</label>
    <input type="date" id="lesDatum">

    <label for="lesTijd">Tijdstip</label>
    <input type="time" id="lesTijd">

</div>
    
        <h2>Lessen registreren</h2>

        <div class="knoppen">

<button onclick="voegLesToe('prive')">
    + Privéles
    <span id="priveTariefKnop"></span>
</button>

<button onclick="voegLesToe('groep')">
    + Groepsles
    <span id="groepTariefKnop"></span>
</button>

        </div>

        <button class="reset-button" onclick="resetVandaag()">
            Reset vandaag
        </button>
    
    <button class="alles-reset-button" onclick="resetAlleLessen()">
    Wis alle lessen
</button>

        <div class="card">

    <h2>Vandaag geregistreerd</h2>

    <div id="lessenLijst"></div>

</div>

    <div class="card">

    <h2>Alle lessen</h2>

    <div id="alleLessenLijst"></div>

</div>
    
        <div class="card omzet-verdeling">

            <h2>Omzetverdeling</h2>

            <div class="regel">
                <span>Omzet excl. btw</span>
                <strong id="kaartExcl">€ 0,00</strong>
            </div>

            <div class="regel">
                <span>BTW</span>
                <strong id="kaartBTW">€ 0,00</strong>
            </div>

            <hr>

            <div class="totaal-regel">
                <span>Totaal incl. btw</span>
                <strong id="kaartIncl">€ 0,00</strong>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
