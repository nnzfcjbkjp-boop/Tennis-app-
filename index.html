<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Omzet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>Tennis Omzet</h1>

        <div class="datum" id="datumVandaag"></div>

        <div class="card">

            <h2>Totale omzet vandaag</h2>

            <div class="groteOmzet" id="omzetVandaag">
                € 0,00
            </div>

            <div class="subtekst" id="omzetExcl">
                € 0,00 excl. btw
            </div>

            <hr>

            <div class="statistieken">

                <div>
                    <div class="statGetal" id="priveAantal">0</div>
                    <div>Privélessen</div>
                </div>

                <div>
                    <div class="statGetal" id="groepAantal">0</div>
                    <div>Groepslessen</div>
                </div>

            </div>

        </div>

        <h2 class="sectieTitel">
            Lessen registreren
        </h2>

        <div class="knoppen">

            <button onclick="voegLesToe('prive')">
                + Privéles
                <span>€63,00</span>
            </button>

            <button onclick="voegLesToe('groep')">
                + Groepsles
                <span>€67,00</span>
            </button>

        </div>

        <button class="reset-button" onclick="resetVandaag()">
            Reset vandaag
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
