<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎾 Tennis Omzet Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎾 Tennis Omzet Calculator</h1>

        <div class="button-row">
            <button onclick="voegPriveToe()">
                + Privéles
            </button>

            <button class="minus-button" onclick="verwijderPrive()">
                - Privéles
            </button>
        </div>

        <div class="button-row">
            <button onclick="voegGroepToe()">
                + Groepsles
            </button>

            <button class="minus-button" onclick="verwijderGroep()">
                - Groepsles
            </button>
        </div>

        <button class="reset-button" onclick="resetVandaag()">
            Reset
        </button>

        <div id="dashboard"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
